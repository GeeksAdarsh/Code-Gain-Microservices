<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#1a1814" />
    <meta name="color-scheme" content="dark light" />
    <style>
      html,body{margin:0;padding:0}
      html{background:#1a1814;color-scheme:dark}
      html.light{background:#faf7f2;color-scheme:light}
      html.light ~ body, html.light body{background:#faf7f2}
    </style>
    <script>
      (function(){var t=localStorage.getItem('theme')||'dark';
      if(t==='light'){
        document.documentElement.classList.add('light');
        document.documentElement.style.background='#faf7f2';
        document.querySelector('meta[name=theme-color]').content='#faf7f2';
        document.querySelector('meta[name=color-scheme]').content='light';
      }})();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Gain Technology — College Coding Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

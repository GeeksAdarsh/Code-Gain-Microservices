# Default server: block direct IP access (e.g. http://13.62.121.151) in production.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Real site: served for the domain AND localhost (local Docker Compose dev).
server {
    listen 80;
    server_name codegaint.com www.codegaint.com localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the backend container (keeps the /api prefix).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # code execution can take a few seconds
    }

    # SPA fallback: every other route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

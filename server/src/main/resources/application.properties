# ========================================
# CodeCampus - Application Configuration
# ========================================

spring.application.name=CodeCampus

# ---- Server ----
# Render (and most PaaS) inject the port via $PORT; locally defaults to 8080.
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# ---- Database ----
# Local default points at localhost; in the cloud set DB_URL/DB_USERNAME/DB_PASSWORD env vars.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/codecampus?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Connection pool: default is only 10. Bump it so many concurrent logins/reads
# don't queue waiting for a DB connection. Tune DB_POOL_SIZE per instance size.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:50}
spring.datasource.hikari.minimum-idle=5

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Admin account / demo accounts ----
# In production set a strong ADMIN_PASSWORD and DEMO_ACCOUNTS=false (disables
# teacher/student/company demo logins with their well-known passwords).
admin.username=${ADMIN_USERNAME:admin}
admin.email=${ADMIN_EMAIL:admin@codecampus.com}
admin.password=${ADMIN_PASSWORD:}
demo.accounts.enabled=${DEMO_ACCOUNTS:true}

# ---- JWT Configuration ----
# Override JWT_SECRET in the cloud (Base64-encoded, >=256-bit).
jwt.secret=${JWT_SECRET:Q29kZUNhbXB1czIwMjZTdXBlclNlY3JldEtleUxvbmdFbm91Z2hGb3JIUzI1NkFsZ29yaXRobQ==}
jwt.expiration=86400000

# ---- CORS ----
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175

# ---- Email / SMTP (Gmail) — optional: fill in to send real reset emails ----
# When username/password are blank, password-reset links are logged to the console (dev mode).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---- App URLs used to build password-reset links in emails ----
app.mail.from=${MAIL_FROM:CodeCampus <no-reply@codecampus.com>}
# Used to build password-reset links; set FRONTEND_URL to your deployed frontend origin.
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.password-reset.expiry-minutes=30

# ---- File Upload ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Judge0 Docker (Auto-detects on startup; falls back to local compilers if not running) ----
# In the cloud this stays unreachable, so execution uses the in-container compilers.
judge0.api.url=${JUDGE0_API_URL:http://localhost:2358}

# ---- Code Execution Timeout (seconds) ----
code.execution.timeout=10
code.execution.memory-limit=256
# Max code runs executing at the same time (protects RAM/CPU during exam spikes).
# Extra submissions wait up to queue-timeout-seconds before being told the server is busy.
code.execution.max-concurrent=${EXEC_MAX_CONCURRENT:12}
code.execution.queue-timeout-seconds=${EXEC_QUEUE_TIMEOUT:60}

# ---- Proctoring ----
# Snapshots are stored in the DB; widen the interval so a full exam hall doesn't fill the disk.
proctoring.snapshot-interval-seconds=${PROCTOR_SNAPSHOT_INTERVAL:300}
proctoring.max-tab-switches=7
proctoring.enable-camera=true
proctoring.enable-fullscreen=true

# ---- College Email Domain (leave empty to allow any email) ----
college.email.domain=
# Example: college.email.domain=@ug.sharda.ac.in

# ---- Plagiarism Detection ----
plagiarism.similarity-threshold=70

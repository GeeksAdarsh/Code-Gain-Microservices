server.port=${PORT:8081}
spring.application.name=auth-service

# Database — auth_db
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:codecampus123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET:Q29kZUNhbXB1czIwMjZTdXBlclNlY3JldEtleUxvbmdFbm91Z2hGb3JIUzI1NkFsZ29yaXRobQ==}
jwt.expiration=86400000

# Admin bootstrap
admin.username=${ADMIN_USERNAME:admin}
admin.email=${ADMIN_EMAIL:admin@codegaint.com}
admin.password=${ADMIN_PASSWORD:admin123}
demo.accounts.enabled=${DEMO_ACCOUNTS:false}

# Email (optional)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend.url=${FRONTEND_URL:http://localhost}
app.password-reset.expiry-minutes=30
college.email.domain=${COLLEGE_EMAIL_DOMAIN:}

# Internal endpoint for other services
# (auth-service exposes GET /internal/users/{id} with no auth)
spring.security.filter.order=10

# Disable banner
spring.main.banner-mode=off
